services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: buscador-editais-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Habilita acesso a variáveis de ambiente dentro das expressões dos nós ($env)
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Variáveis consumidas pelos nós do workflow (Produção Render & Vercel)
      - BACKEND_URL=https://buscador-de-editais.onrender.com
      - FRONTEND_URL=https://buscador-de-editais-orpin.vercel.app
      - PIPELINE_API_KEY=metro_inovacao_n8n_secret_2026
      # Preencha a URL do webhook do Teams ou deixe vazia para testes manuais
      - TEAMS_WEBHOOK_URL=https://seu-endpoint-teams.webhook.office.com
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
    driver: local

